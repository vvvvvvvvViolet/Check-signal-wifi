name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    env:
      # Runners have no Wi-Fi radio, so the suite runs against the simulator.
      # Pinning the seed keeps the generated readings identical run to run.
      CSW_WIFI_BACKEND: mock
      CSW_MOCK_SEED: '1337'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint
        run: ruff check .
        working-directory: backend

      - name: Tests
        run: pytest -q
        working-directory: backend

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  smoke:
    name: End-to-end smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      CSW_WIFI_BACKEND: mock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: |
          pip install -r backend/requirements.txt
          npm --prefix frontend ci

      - name: Build the UI
        run: npm --prefix frontend run build

      - name: Start the server
        run: |
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          for _ in $(seq 30); do
            curl -sf http://127.0.0.1:8000/api/health && break
            sleep 1
          done

      - name: Seed a demo survey
        run: python scripts/seed_demo.py

      - name: Check the app actually serves
        run: |
          set -euo pipefail
          # The SPA is served, and unknown API paths still 404 rather than
          # falling through to index.html.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/heatmap)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/nope)" = 404

          # Every export format produces a real file of the right type.
          curl -sf 'http://127.0.0.1:8000/api/report/history?format=pdf' -o report.pdf
          curl -sf 'http://127.0.0.1:8000/api/report/history?format=xlsx' -o report.xlsx
          curl -sf 'http://127.0.0.1:8000/api/report/heatmap/1?format=csv' -o survey.csv
          head -c 4 report.pdf | grep -q '%PDF'
          head -c 2 report.xlsx | grep -q 'PK'
          test -s survey.csv
